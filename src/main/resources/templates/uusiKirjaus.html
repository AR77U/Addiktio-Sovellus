<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Uusi kirjaus</title>
</head>
<body>
    <h1>Uusi kirjaus</h1>
    <form th:object="${uusiKirjaus}" th:action="@{/save}" method="post">
        <div style="clear: both;display: block; height: 50px;">
                <label for="onnistuminen">Onnistuitko?</label>
                <input type="radio" id="onnistuminenKylla" th:field="*{onnistuminen}" value="true"/>
                <label for="onnistuminenKylla">Kyllä</label>
        
                <input type="radio" id="onnistuminenEi" th:field="*{onnistuminen}" value="false"/>
                <label for="onnistuminenEi">En</label>
        </div>
        <div style="clear: both;display: block; height: 50px;">
                <label for="hankaluusaste">Hankaluusaste</label>
                <select th:field="*{hankaluusaste}">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
                <span th:if="${#fields.hasErrors('hankaluusaste')}" th:errors= "*{hankaluusaste}" class="text-danger"></span>
         </div>
         <div style="clear: both;display: block; height: 50px;">       
                <label for="mietteet">Mietteet</label>
                <span th:if="${#fields.hasErrors('mietteet')}" th:errors= "*{mietteet}" class="text-danger"></span>
         </div>
         <div>
                <textarea th:field="*{mietteet}" rows="5" cols="40"></textarea>
        </div>

        <div style="clear: both;display: block; height: 50px;">
            <input type="submit" value="Tallenna">
        </div>
                
</body>
