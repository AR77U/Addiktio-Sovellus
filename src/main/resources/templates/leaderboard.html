<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Leaderboard</title>
</head>
<body>
    <h1>Off That! Leaderboard</h1>
    <a class="btn btn-primary" th:href="@{/profiili}">Kirjaudu/Profiili</a>
    <table class="table table-striped">
        <tr>
            <th>Käyttäjä</th>
            <th>Off:</th>
            <th>Putki</th>
        </tr>
        <tr th:each = "kayttaja : ${kayttajat}">
            <td th:text="${kayttaja.kayttajanimi}"></td>
            <td th:text="${kayttaja.aine}"></td>
            <td th:text="${kayttaja.putki}"></td>
        </tr>
    </table>
    
</body>
</html>
