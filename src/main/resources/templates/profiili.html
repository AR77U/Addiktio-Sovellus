<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Profiili</title>
</head>
<body>
    
    <h1>Kirjauksesi <span sec:authentication="name"></span></h1>
    <h2>Streakin pituus: <span th:text ="${streakit}"></span></h2>
    <a class="btn btn-primary" th:href="@{/}">Leaderboard</a>
    <table class="table table-striped">
        <tr>
            <th>Päivämäärä</th>
            <th>Onnistuminen</th>
            <th>Hankaluusaste</th>
            <th>Mietteet</th>
            
        </tr>
        <tr th:each = "kirjaus : ${kirjaukset}">
            <td th:text="${kirjaus.pvm}"></td>
            <td th:text="${kirjaus.onnistuminen}"></td>
            <td th:text="${kirjaus.hankaluusaste}"></td>
            <td th:text="${kirjaus.Mietteet}"></td>
            
        </tr>
    </table>
    
</body>
</html>
